# Profile visuals generated every day (no third-party card service), published on the "output" branch:
#   - metrics.svg: accurate stats including private repositories (lowlighter/metrics, METRICS_TOKEN secret:
#     classic token with read:user and repo scopes);
#   - snake-*.svg: contribution snake (Platane/snk).
name: Profile

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  snake:
    name: Contribution snake
    runs-on: ubuntu-24.04
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#3D5AFE&color_dots=#EBEDF0,#C9D2FF,#9AAAFF,#6E86FF,#3D5AFE
            dist/snake-dark.svg?palette=github-dark&color_snake=#7C90FF&color_dots=#161B22,#1E2A66,#2C3FA3,#3D5AFE,#7C90FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "Contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    name: Metrics (private repositories included)
    needs: snake
    runs-on: ubuntu-24.04
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Metrics
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: output
          committer_message: "Metrics"
          config_timezone: Africa/Porto-Novo
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8
          repositories_affiliations: owner, collaborator, organization_member
